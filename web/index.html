<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFD2EC">
  <meta name="description" content="Your little space to explore, experiment and learn. Kawaii Study Buddy.">
  <title>Study Buddy</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <div class="tape tape-left" aria-hidden="true"></div><div class="tape tape-right" aria-hidden="true"></div>
    <div class="decoration heart-one" aria-hidden="true">♡</div><div class="decoration heart-two" aria-hidden="true">✧</div>
    <div id="connection" class="connection" role="status" hidden></div>
    <main id="app" tabindex="-1" aria-label="Study Buddy"></main>
    <nav id="navigation" class="navigation" aria-label="Main navigation"></nav>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dialog"><div id="dialog-content"></div><button class="button wide" data-action="close-dialog">Got it</button></dialog>
  <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
  <noscript>Please enable JavaScript to use Study Buddy.</noscript>
</body>
</html>
