name: physim-ai

services:
  physim:
    image: physim-ai:pilot
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      ALLOWED_ORIGINS: https://${PHYSIM_DOMAIN:?Set PHYSIM_DOMAIN to your server hostname}
    expose:
      - "4000"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      physim:
        condition: service_healthy
    environment:
      PHYSIM_DOMAIN: ${PHYSIM_DOMAIN:?Set PHYSIM_DOMAIN to your server hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
